server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ─── Compression ─────────────────────────────────────────────────
    # No gzip was configured at all — every API response (KM article
    # bodies especially: repetitive HTML, often 70-90% compressible)
    # went over the wire uncompressed. gzip_proxied is needed because
    # /api/ responses arrive via proxy_pass — nginx doesn't gzip
    # proxied responses by default even with gzip on.
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types application/json application/javascript text/javascript
        text/css text/plain text/xml application/xml;

    # ─── Security headers ─────────────────────────────────────────────
    # Applied at server scope so every response (HTML / assets / proxied API)
    # carries them. `always` makes nginx emit them on error responses too.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS: Cloudflare Tunnel terminates TLS, so the user-facing scheme is HTTPS.
    # 1 year max-age, include subdomains, preload-eligible.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP: deliberately permissive on script-src because the Vite bundle uses
    # inline runtime helpers; tighten further once we've audited every inline.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # index.html - no cache (so new deploys take effect immediately)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Frontend - SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets (JS/CSS with hash in filename) - cache aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 10M;
    }

    # NOTE: previously this block proxied /uploads/ → backend, but the backend
    # has no public StaticFiles mount for that path. All file access now goes
    # through /api/files/download/{path} which enforces auth. Removed to avoid
    # confusion and to ensure no future code accidentally adds a public mount
    # that would bypass the authenticated download endpoint.
}
